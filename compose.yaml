name: defi-en-sql
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c jit=off
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - .:/work:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
